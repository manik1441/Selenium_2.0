name: Mirror to GitLab

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # important for --mirror

      - name: Configure Git identity
        run: |
          git config user.name "Manik Chaudhary"
          git config user.email "manik1441@gmail.com"

      - name: Mirror to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GOTLAB_TOKEN }}@gitlab.com/manik1441/Selenium_2.0.git
          git push --mirror gitlab
